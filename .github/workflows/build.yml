- name: Set up Node.js
  uses: actions/setup-node@v4
  with:
    node-version: 22
    cache: npm

- name: Install dependencies
  run: npm ci

- name: Static preflight
  run: npm run preflight:static

- name: Lint
  run: npm run lint

- name: TypeScript check
  run: npm run typecheck

- name: Unit and security tests
  run: npm test

- name: Production build
  run: npm run build

- name: Runtime smoke tests
  run: npm run test:smoke
