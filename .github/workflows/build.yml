
name: Roopo Visa Linux Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No source ZIP found in repository root."
            exit 1
          fi
          mkdir -p app
          unzip -q "$ZIP_FILE" -d app
          test -f app/package.json || {
            echo "ERROR: package.json not found after extraction."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Static preflight
        working-directory: app
        run: npm run preflight:static

      - name: Lint
        working-directory: app
        run: npm run lint

      - name: TypeScript check
        working-directory: app
        run: npm run typecheck

      - name: Unit and security tests
        working-directory: app
        run: npm test

      - name: Production build
        working-directory: app
        run: npm run build

      - name: Runtime smoke tests
        working-directory: app
        run: npm run test:smoke
